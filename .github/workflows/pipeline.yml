name: InfraAutomate CI/CD

on:
  push:
    branches: [main]

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask flake8

      - name: Run linting
        run: flake8 app/app.py --max-line-length=100 --ignore=E203,W503
        
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flask pytest requests

      - name: Run health check
        run: |
          python app/app.py &
          sleep 3
          python scripts/python/health_check.py

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t infraautomate:latest .

      - name: Verify image
        run: docker images | grep infraautomate

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            STATUS="✅ Pipeline PASSED"
            COLOR="good"
          else
            STATUS="❌ Pipeline FAILED"
            COLOR="danger"
          fi
          
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"${STATUS} - infraautomate pipeline on branch ${{ github.ref_name }} by ${{ github.actor }}\"}" \
          $SLACK_WEBHOOK_URL        