name: infraautomate CI/CD


on:
    push:
        branches: [main]
        
jobs:
    lint:
        name: Code Quality
        runs_on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            
            -name: Set up Python
            uses: actions/setup-python@v5
            with:
                python-version: '3.11'
                
            - name: Install dependencies
              run: pip install flask flake8
        
      - name: Run linting
        run: flake8 app/app.py --max-line-length=100

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: pip install flask pytest requests
        
      - name: Run health check script
        run: |
          python app/app.py &
          sleep 3
          python scripts/python/health_check.py

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t infraautomate:latest .
        
      - name: Verify image built
        run: docker images | grep infraautomate